name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 1. Build React frontend ──────────────────────────────────────────────
      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
        env:
          REACT_APP_API_URL: https://smartparknepal.azurewebsites.net/api/v1
          REACT_APP_SOCKET_URL: https://smartparknepal.azurewebsites.net
          GENERATE_SOURCEMAP: 'false'
          CI: 'false'

      # ── 2. Move React build into backend/public ──────────────────────────────
      - name: Sync frontend build into backend/public
        run: |
          mkdir -p backend/public
          cp -r frontend/build/. backend/public/

      # ── 3. Install backend production dependencies ────────────────────────────
      - name: Install backend dependencies
        run: |
          cd backend
          npm install --production

      # ── 4. Deploy backend folder to Azure App Service ────────────────────────
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'smartparknepal'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './backend'
