name: Deploy to Azure Web App

on:
  workflow_dispatch:     # manual only — no Azure App Service running right now

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: ./frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_API_URL: https://smartparknepal.azurewebsites.net/api/v1
          REACT_APP_SOCKET_URL: https://smartparknepal.azurewebsites.net
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Move frontend build to backend/public
        working-directory: ./frontend
        run: |
          mkdir -p ../backend/public
          cp -r build/. ../backend/public/.

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'smartparknepal'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './backend'
