name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 1. Build React frontend ──────────────────────────────────────────────
      - name: Install and build frontend
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build
        env:
          REACT_APP_API_URL: https://smartparknepal.azurewebsites.net/api/v1
          REACT_APP_SOCKET_URL: https://smartparknepal.azurewebsites.net
          GENERATE_SOURCEMAP: 'false'

      # ── 2. Copy React build into backend/public (Express serves it) ──────────
      - name: Copy frontend build into backend/public
        run: |
          rm -rf backend/public
          cp -r frontend/build backend/public

      # ── 3. Install backend production dependencies ────────────────────────────
      - name: Install backend dependencies
        run: |
          cd backend
          npm install --omit=dev --no-audit --no-fund

      # ── 4. Deploy ./backend to Azure App Service via Publish Profile ──────────
      # package: './backend' is correct — it contains package.json + the React
      # build (in backend/public/) + production node_modules.
      # Azure App Service reads its own package.json and runs: node server.js
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'smartparknepal'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './backend'
