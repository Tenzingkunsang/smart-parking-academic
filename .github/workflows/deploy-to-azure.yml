name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Frontend: install ────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      # ── Frontend: build ──────────────────────────────────────────────────────
      - name: Build frontend
        working-directory: ./frontend
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_API_URL: https://smartparknepal.azurewebsites.net/api/v1
          REACT_APP_SOCKET_URL: https://smartparknepal.azurewebsites.net
        run: npm run build

      # ── Copy build into backend/public ───────────────────────────────────────
      - name: Move frontend build to backend/public
        working-directory: ./frontend
        run: |
          mkdir -p ../backend/public
          cp -r build/. ../backend/public/.

      # ── Deploy backend folder to Azure App Service ───────────────────────────
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'smartparknepal'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './backend'
