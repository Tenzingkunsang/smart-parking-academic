name: Trigger auto deployment for smartpark-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/smartpark-backend-AutoDeployTrigger-3f94a048-c5f5-41a4-94a3-49d764db7a56.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SMARTPARKBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SMARTPARKBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SMARTPARKBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/Dockerfile.backend 
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: smartparkacr2025.azurecr.io
          registryUsername: ${{ secrets.SMARTPARKBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SMARTPARKBACKEND_REGISTRY_PASSWORD }}
          containerAppName: smartpark-backend
          resourceGroup: smartpark-rg
          imageToBuild: smartparkacr2025.azurecr.io/smartpark-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


